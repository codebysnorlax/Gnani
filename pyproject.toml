[project]
name = "consumerdost"
version = "0.1.0"
description = "ConsumerDost — AI-Powered Voice Consumer Rights & Pre-Litigation Dispute Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.10.0",
    "aiosqlite>=0.20.0",
    "google-genai>=0.1.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.2.0",
    "rapidfuzz>=3.8.0",
    "reportlab>=4.2.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
