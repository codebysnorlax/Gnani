[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consumerdost"
version = "0.1.0"
description = "AI-Powered Voice Consumer Rights & Pre-Litigation Dispute Engine"
readme = "PRD.md"
requires-python = ">=3.10"
dependencies = [
    "gnani-vachana>=0.9.0",
    "aiogram>=3.10.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "reportlab>=4.0.0",
    "rapidfuzz>=3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pypdf>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
